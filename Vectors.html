<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Vector Addition & Subtraction Lab</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 1000px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 15px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e1e4e8;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .top-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:active {
      transform: scale(0.98);
    }
    button.secondary {
      background: #e2e8f0;
      color: #1e293b;
    }
    button.secondary:hover {
      background: #cbd5e1;
    }
    button.warning {
      background: #f59e0b;
    }
    button.warning:hover {
      background: #d97706;
    }
    button.danger {
      background: #ef4444;
    }
    button.danger:hover {
      background: #dc2626;
    }
    button.operator {
      background: #059669;
      font-size: 18px;
      padding: 4px 12px;
    }
    button.operator:hover {
      background: #047857;
    }
    button.ce-btn {
      font-size: 16px;
      padding: 4px 12px;
    }
    .equation-bar {
      padding: 12px 20px;
      background: #f8fafc;
      border-bottom: 1px solid #e1e4e8;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .eq-display {
      min-width: 200px;
      height: 40px;
      background: white;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #0f172a;
    }
    .vector-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .vec-btn {
      background: #8b5cf6;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      padding: 0;
    }
    .vec-btn:hover {
      background: #7c3aed;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      height: 600px;
      background-color: #ffffff;
    }
    canvas {
      width: 100%;
      height: 600px;
      display: block;
      cursor: crosshair;
    }
    .instructions {
      padding: 10px 20px;
      background: #f1f5f9;
      font-size: 13px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
    }
    .flex-spacer {
      flex-grow: 1;
    }
    .right-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="top-controls">
      <button id="addVecBtn">+ Vector</button>
      <button id="undoVecBtn" class="warning">Undo Vector</button>
      <button id="resetAllBtn" class="secondary">Reset All</button>
    </div>
  </header>

  <div class="equation-bar">
    <span style="font-weight: 600; color: #475569;">Equation:</span>
    <div class="eq-display" id="eqDisplay"></div>
    <div style="display: flex; gap: 6px;">
      <button class="operator" id="calcBtn">=</button>
      <button class="danger ce-btn" id="clearBtn">CE</button>
    </div>
    
    <div class="flex-spacer"></div>
    
    <!-- Operators + / - positioned next to vector buttons on the right -->
    <div class="right-controls">
      <div style="display: flex; gap: 6px;">
        <button class="operator" id="btnPlus">+</button>
        <button class="operator" id="btnMinus">-</button>
      </div>
      <div class="vector-buttons" id="vectorButtons"></div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="canvas" width="1000" height="600"></canvas>
  </div>

  <div class="instructions">
    <span>💡 <b>Tip:</b> Click and drag on empty canvas to draw a vector, or drag vector endpoints/bodies to reposition.</span>
    <span id="statusText">Ready</span>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // UI Elements
  const eqDisplay = document.getElementById('eqDisplay');
  const vectorButtons = document.getElementById('vectorButtons');
  const addVecBtn = document.getElementById('addVecBtn');
  const undoVecBtn = document.getElementById('undoVecBtn');
  const calcBtn = document.getElementById('calcBtn');
  const clearBtn = document.getElementById('clearBtn');
  const resetAllBtn = document.getElementById('resetAllBtn');
  const btnPlus = document.getElementById('btnPlus');
  const btnMinus = document.getElementById('btnMinus');
  const statusText = document.getElementById('statusText');

  // Colors for vectors
  const COLOR_PALETTE = ['#2563eb', '#d97706', '#059669', '#7c3aed', '#db2777', '#0891b2', '#ea580c'];

  // Application State
  let vectors = []; // User defined original vectors
  let activeAnimationVectors = []; // Cloned vectors created during calculation (handles duplicates like B1, B2)
  let equationTokens = []; // Token sequence, e.g., ['A', '+', 'B', '-', 'B']
  let labelIndex = 0;
  
  // Interaction state
  let isDrawingNew = false;
  let newStart = null;
  let draggedObject = null;
  let isAnimating = false;
  let resultantVector = null;

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    draw();
  }
  window.addEventListener('resize', resizeCanvas);

  function getLabel(idx) {
    let label = '';
    while (idx >= 0) {
      label = String.fromCharCode(65 + (idx % 26)) + label;
      idx = Math.floor(idx / 26) - 1;
    }
    return label;
  }

  // --- Vector Creation & Management ---
  function addVector(x1, y1, x2, y2) {
    const label = getLabel(labelIndex);
    const color = COLOR_PALETTE[labelIndex % COLOR_PALETTE.length];
    labelIndex++;

    const vec = {
      id: label,
      label: label,
      displayLabel: label,
      x1, y1, x2, y2,
      originalX1: x1, originalY1: y1,
      originalX2: x2, originalY2: y2,
      color: color
    };

    vectors.push(vec);
    createVectorButton(vec);
    draw();
  }

  function removeLastVector() {
    if (isAnimating || vectors.length === 0) return;

    const removedVec = vectors.pop();
    labelIndex = Math.max(0, labelIndex - 1);

    equationTokens = equationTokens.filter(token => token !== removedVec.label);

    while (equationTokens.length > 0 && (equationTokens[equationTokens.length - 1] === '+' || equationTokens[equationTokens.length - 1] === '-')) {
      equationTokens.pop();
    }

    renderVectorButtons();
    resultantVector = null;
    activeAnimationVectors = [];
    resetVectorPositions();
    updateEquationDisplay();
    draw();
  }

  function createVectorButton(vec) {
    const btn = document.createElement('button');
    btn.className = 'vec-btn';
    btn.id = 'vec-btn-' + vec.label;
    btn.textContent = vec.label;
    btn.style.backgroundColor = vec.color;
    btn.addEventListener('click', () => {
      if (isAnimating) return;
      const last = equationTokens[equationTokens.length - 1];
      if (!last || last === '+' || last === '-') {
        equationTokens.push(vec.label);
        updateEquationDisplay();
      }
    });
    vectorButtons.appendChild(btn);
  }

  function renderVectorButtons() {
    vectorButtons.innerHTML = '';
    vectors.forEach(v => createVectorButton(v));
  }

  // --- Equation Controls ---
  btnPlus.addEventListener('click', () => {
    if (isAnimating) return;
    const last = equationTokens[equationTokens.length - 1];
    if (last && last !== '+' && last !== '-') {
      equationTokens.push('+');
      updateEquationDisplay();
    }
  });

  btnMinus.addEventListener('click', () => {
    if (isAnimating) return;
    const last = equationTokens[equationTokens.length - 1];
    if (last && last !== '+' && last !== '-') {
      equationTokens.push('-');
      updateEquationDisplay();
    }
  });

  clearBtn.addEventListener('click', () => {
    if (isAnimating) return;
    equationTokens = [];
    resultantVector = null;
    activeAnimationVectors = [];
    resetVectorPositions();
    updateEquationDisplay();
    draw();
  });

  resetAllBtn.addEventListener('click', () => {
    if (isAnimating) return;
    vectors = [];
    activeAnimationVectors = [];
    equationTokens = [];
    labelIndex = 0;
    resultantVector = null;
    vectorButtons.innerHTML = '';
    updateEquationDisplay();
    draw();
  });

  undoVecBtn.addEventListener('click', () => {
    removeLastVector();
  });

  function updateEquationDisplay() {
    eqDisplay.textContent = equationTokens.join(' ');
  }

  function resetVectorPositions() {
    vectors.forEach(v => {
      v.displayLabel = v.label;
      v.x1 = v.originalX1;
      v.y1 = v.originalY1;
      v.x2 = v.originalX2;
      v.y2 = v.originalY2;
    });
  }

  addVecBtn.addEventListener('click', () => {
    if (isAnimating) return;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const offset = (vectors.length * 20) % 100;
    addVector(cx - 50 + offset, cy + offset, cx + 50 + offset, cy - 50 + offset);
  });

  // --- Canvas Interaction ---
  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  function dist(p1, p2) {
    return Math.hypot(p1.x - p2.x, p1.y - p2.y);
  }

  function pointToSegmentDistance(p, v, w) {
    const l2 = (w.x - v.x)**2 + (w.y - v.y)**2;
    if (l2 === 0) return dist(p, v);
    let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
    t = Math.max(0, Math.min(1, t));
    return dist(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) });
  }

  canvas.addEventListener('mousedown', (e) => {
    if (isAnimating) return;
    const pos = getMousePos(e);

    for (let i = vectors.length - 1; i >= 0; i--) {
      const v = vectors[i];
      if (dist(pos, {x: v.x2, y: v.y2}) < 12) {
        draggedObject = { vector: v, part: 'end' };
        return;
      }
      if (dist(pos, {x: v.x1, y: v.y1}) < 12) {
        draggedObject = { vector: v, part: 'start' };
        return;
      }
    }

    for (let i = vectors.length - 1; i >= 0; i--) {
      const v = vectors[i];
      if (pointToSegmentDistance(pos, {x: v.x1, y: v.y1}, {x: v.x2, y: v.y2}) < 8) {
        draggedObject = { 
          vector: v, 
          part: 'body', 
          offsetX: pos.x - v.x1, 
          offsetY: pos.y - v.y1,
          dx: v.x2 - v.x1,
          dy: v.y2 - v.y1
        };
        return;
      }
    }

    isDrawingNew = true;
    newStart = pos;
  });

  canvas.addEventListener('mousemove', (e) => {
    const pos = getMousePos(e);

    if (draggedObject) {
      const v = draggedObject.vector;
      if (draggedObject.part === 'end') {
        v.x2 = pos.x;
        v.y2 = pos.y;
      } else if (draggedObject.part === 'start') {
        v.x1 = pos.x;
        v.y1 = pos.y;
      } else if (draggedObject.part === 'body') {
        v.x1 = pos.x - draggedObject.offsetX;
        v.y1 = pos.y - draggedObject.offsetY;
        v.x2 = v.x1 + draggedObject.dx;
        v.y2 = v.y1 + draggedObject.dy;
      }
      v.originalX1 = v.x1; v.originalY1 = v.y1;
      v.originalX2 = v.x2; v.originalY2 = v.y2;
      draw();
    } else if (isDrawingNew) {
      draw();
      drawArrow(ctx, newStart.x, newStart.y, pos.x, pos.y, '#94a3b8', '...', false);
    }
  });

  canvas.addEventListener('mouseup', (e) => {
    if (isDrawingNew) {
      const pos = getMousePos(e);
      if (dist(newStart, pos) > 15) {
        addVector(newStart.x, newStart.y, pos.x, pos.y);
      }
      isDrawingNew = false;
      newStart = null;
    }
    draggedObject = null;
  });

  // --- Drawing Logic ---
  function drawArrow(context, x1, y1, x2, y2, color, label, isDotted = false) {
    const headLength = 14;
    const dx = x2 - x1;
    const dy = y2 - y1;
    const angle = Math.atan2(dy, dx);

    context.save();
    context.strokeStyle = color;
    context.fillStyle = color;
    context.lineWidth = 3;

    if (isDotted) {
      context.setLineDash([6, 6]);
    } else {
      context.setLineDash([]);
    }

    context.beginPath();
    context.moveTo(x1, y1);
    context.lineTo(x2, y2);
    context.stroke();

    context.setLineDash([]);
    context.beginPath();
    context.moveTo(x2, y2);
    context.lineTo(
      x2 - headLength * Math.cos(angle - Math.PI / 6),
      y2 - headLength * Math.sin(angle - Math.PI / 6)
    );
    context.lineTo(
      x2 - headLength * Math.cos(angle + Math.PI / 6),
      y2 - headLength * Math.sin(angle + Math.PI / 6)
    );
    context.closePath();
    context.fill();

    if (!isDotted && !isAnimating) {
      context.fillStyle = '#ffffff';
      context.beginPath();
      context.arc(x1, y1, 5, 0, Math.PI * 2);
      context.fill();
      context.stroke();

      context.beginPath();
      context.arc(x2, y2, 5, 0, Math.PI * 2);
      context.fill();
      context.stroke();
    }

    if (label) {
      context.font = 'bold 16px sans-serif';
      context.fillStyle = color;
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;
      const nx = -Math.sin(angle) * 18;
      const ny = Math.cos(angle) * 18;
      context.fillText(label, midX + nx - 6, midY + ny + 6);
    }

    context.restore();
  }

  function drawGrid() {
    ctx.strokeStyle = '#f1f5f9';
    ctx.lineWidth = 1;
    const gridSize = 30;

    for (let x = 0; x <= canvas.width; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
    }

    for (let y = 0; y <= canvas.height; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvas.width, y);
      ctx.stroke();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();

    // If active animation vectors exist, render them (handles duplicates B1, B2)
    if (activeAnimationVectors.length > 0) {
      activeAnimationVectors.forEach(v => {
        drawArrow(ctx, v.x1, v.y1, v.x2, v.y2, v.color, v.displayLabel);
      });
    } else {
      // Otherwise render standard base vectors
      vectors.forEach(v => {
        drawArrow(ctx, v.x1, v.y1, v.x2, v.y2, v.color, v.displayLabel);
      });
    }

    // Draw resultant vector if calculated
    if (resultantVector) {
      drawArrow(
        ctx, 
        resultantVector.x1, resultantVector.y1, 
        resultantVector.x2, resultantVector.y2, 
        '#dc2626', resultantVector.label, true
      );
    }
  }

  // --- Calculation & Animation ---
  calcBtn.addEventListener('click', () => {
    if (isAnimating) return;
    if (equationTokens.length === 0) {
      alert("Please enter an equation first!");
      return;
    }

    const sequence = [];
    let currentOp = '+';

    for (let i = 0; i < equationTokens.length; i++) {
      const token = equationTokens[i];
      if (token === '+' || token === '-') {
        currentOp = token;
      } else {
        const vec = vectors.find(v => v.label === token);
        if (vec) {
          sequence.push({ vec, op: currentOp });
        }
      }
    }

    if (sequence.length === 0) return;

    // Count occurrences to determine if numbering (B1, B2, B3) is needed
    const occurrences = {};
    sequence.forEach(item => {
      occurrences[item.vec.label] = (occurrences[item.vec.label] || 0) + 1;
    });

    const runningIndex = {};

    isAnimating = true;
    resultantVector = null;
    activeAnimationVectors = [];
    statusText.textContent = "Animating calculation...";

    const steps = [];
    let currentTail = { x: sequence[0].vec.originalX1, y: sequence[0].vec.originalY1 };

    sequence.forEach((item) => {
      const label = item.vec.label;
      const isMultiple = occurrences[label] > 1;

      runningIndex[label] = (runningIndex[label] || 0) + 1;

      // Labeling logic: B1, B2 if repeated; otherwise standard label B
      const baseName = isMultiple ? `${label}${runningIndex[label]}` : label;
      const isSubtracted = (item.op === '-');
      const finalDisplayLabel = isSubtracted ? `-${baseName}` : baseName;

      // Create cloned vector instance for this specific occurrence
      const cloneVec = {
        id: baseName + '_' + Math.random(),
        label: baseName,
        displayLabel: finalDisplayLabel,
        x1: item.vec.x1,
        y1: item.vec.y1,
        x2: item.vec.x2,
        y2: item.vec.y2,
        color: item.vec.color
      };

      activeAnimationVectors.push(cloneVec);

      const origDx = item.vec.originalX2 - item.vec.originalX1;
      const origDy = item.vec.originalY2 - item.vec.originalY1;

      const dx = isSubtracted ? -origDx : origDx;
      const dy = isSubtracted ? -origDy : origDy;

      const targetX1 = currentTail.x;
      const targetY1 = currentTail.y;
      const targetX2 = targetX1 + dx;
      const targetY2 = targetY1 + dy;

      steps.push({
        vec: cloneVec,
        startX1: item.vec.x1,
        startY1: item.vec.y1,
        startX2: item.vec.x2,
        startY2: item.vec.y2,
        targetX1, targetY1,
        targetX2, targetY2
      });

      currentTail = { x: targetX2, y: targetY2 };
    });

    animateSteps(steps, 0, () => {
      const firstStep = steps[0];
      const lastStep = steps[steps.length - 1];

      resultantVector = {
        x1: firstStep.targetX1,
        y1: firstStep.targetY1,
        x2: lastStep.targetX2,
        y2: lastStep.targetY2,
        label: "R (" + equationTokens.join('') + ")"
      };

      isAnimating = false;
      statusText.textContent = "Calculation Complete";
      draw();
    });
  });

  function animateSteps(steps, index, onComplete) {
    if (index >= steps.length) {
      onComplete();
      return;
    }

    const step = steps[index];
    const duration = 500;
    const startTime = performance.now();

    function frame(time) {
      let elapsed = time - startTime;
      let progress = Math.min(elapsed / duration, 1);

      let ease = progress < 0.5 
        ? 4 * progress * progress * progress 
        : 1 - Math.pow(-2 * progress + 2, 3) / 2;

      step.vec.x1 = step.startX1 + (step.targetX1 - step.startX1) * ease;
      step.vec.y1 = step.startY1 + (step.targetY1 - step.startY1) * ease;
      step.vec.x2 = step.startX2 + (step.targetX2 - step.startX2) * ease;
      step.vec.y2 = step.startY2 + (step.targetY2 - step.startY2) * ease;

      draw();

      if (progress < 1) {
        requestAnimationFrame(frame);
      } else {
        setTimeout(() => animateSteps(steps, index + 1, onComplete), 100);
      }
    }

    requestAnimationFrame(frame);
  }

  // Initial setup
  resizeCanvas();
  addVector(200, 350, 350, 250); // A
  addVector(450, 350, 550, 200); // B
</script>
</body>
</html>
