
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equations and Inequalities True or False</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: one centered "worksheet" card on graph paper. Statement on top, verdict and reasoning appear below on Next. */
  :root {
    --paper: #f6f8fb;
    --grid: #dbe4ef;
    --card: #ffffff;
    --ink: #14213d;
    --ink-soft: #4a5876;
    --line: #cfd8e6;
    --accent: #2f5bd9;
    --true: #14724b;
    --true-bg: #dff3e9;
    --false: #b4340f;
    --false-bg: #fde6dd;
    --display: "Space Grotesk", "Trebuchet MS", Arial, sans-serif;
    --text: "Inter", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101826;
      --grid: #1b273b;
      --card: #172236;
      --ink: #eaf0fb;
      --ink-soft: #a7b4cc;
      --line: #2b3a54;
      --accent: #8fb0ff;
      --true: #6fdca8;
      --true-bg: #123b2b;
      --false: #ff9d7a;
      --false-bg: #46211a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101826;
    --grid: #1b273b;
    --card: #172236;
    --ink: #eaf0fb;
    --ink-soft: #a7b4cc;
    --line: #2b3a54;
    --accent: #8fb0ff;
    --true: #6fdca8;
    --true-bg: #123b2b;
    --false: #ff9d7a;
    --false-bg: #46211a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--text);
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    display: flex;
    flex-direction: column;
    padding: 20px max(16px, env(safe-area-inset-left, 0px)) 20px max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .title {
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    margin: 0;
  }
  .title span { color: var(--accent); }
  .counter {
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }
  .dots { display: flex; gap: 8px; flex-wrap: wrap; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
  }
  .dot.now { border-color: var(--accent); background: var(--accent); }
  .dot.done.t { border-color: var(--true); background: var(--true); }
  .dot.done.f { border-color: var(--false); background: var(--false); }

  main {
    flex: 1;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: clamp(20px, 4vw, 48px);
    display: flex;
    flex-direction: column;
    gap: 24px;
    min-width: 0;
    overflow: auto;
  }
  .claim {
    font-size: clamp(24px, 3.4vw, 42px);
    line-height: 1.4;
    color: var(--ink-soft);
    margin: 0;
    max-width: 38em;
  }
  .claim b { color: var(--ink); font-weight: 600; }
  .eq {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(36px, 7vw, 84px);
    line-height: 1.3;
    margin: 0;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .eq.small { font-size: clamp(30px, 5vw, 60px); }

  /* stacked fractions */
  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 0.12em;
    line-height: 1.2;
  }
  .frac .n { padding: 0 0.15em 0.04em; border-bottom: 0.07em solid currentColor; }
  .frac .d { padding: 0.04em 0.15em 0; }

  .answer {
    border-radius: 10px;
    padding: clamp(16px, 2.6vw, 28px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: rise 220ms ease-out both;
  }
  .answer.t { background: var(--true-bg); }
  .answer.f { background: var(--false-bg); }
  .verdict {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(30px, 5vw, 56px);
    margin: 0;
    line-height: 1;
  }
  .answer.t .verdict { color: var(--true); }
  .answer.f .verdict { color: var(--false); }
  .why {
    font-size: clamp(17px, 2.1vw, 26px);
    line-height: 1.45;
    margin: 0;
    max-width: 44em;
  }
  .check {
    font-family: var(--display);
    font-size: clamp(17px, 2.1vw, 26px);
    line-height: 1.4;
    margin: 0;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
  }
  .check b { color: var(--ink); }

  .end { align-items: flex-start; justify-content: center; }
  .end h2 { font-family: var(--display); font-size: clamp(32px, 6vw, 68px); margin: 0; }
  .end p { font-size: clamp(18px, 2.4vw, 28px); color: var(--ink-soft); margin: 0; max-width: 34em; line-height: 1.4; }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hint { color: var(--ink-soft); font-size: 15px; }
  .btns { display: flex; gap: 12px; }
  button {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(18px, 2vw, 24px);
    padding: 12px 28px;
    border-radius: 10px;
    border: 2px solid var(--accent);
    cursor: pointer;
    color: var(--accent);
    background: transparent;
  }
  button.primary { background: var(--accent); color: var(--paper); }
  button:disabled { opacity: 0.35; cursor: default; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .answer { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="title">Equations &amp; Inequalities: <span>True or False?</span></h1>
    <div class="counter" id="counter" aria-live="polite"></div>
  </header>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <main id="stage"></main>
  <footer>
    <div class="hint">Space or &rarr; for next &middot; &larr; to go back</div>
    <div class="btns">
      <button id="back" type="button">Back</button>
      <button id="next" type="button" class="primary">Show answer</button>
    </div>
  </footer>
</div>

<script>
function f(n, d) {
  return '<span class="frac"><span class="n">' + n + '</span><span class="d">' + d + '</span></span>';
}
var PASTED = f("3x + 2", "4") + " = " + f("2x − 3", "5");

var Q = [
  { claim: "True or false: cross-multiplying this equation gives 4(3x + 2) = 5(2x \u2212 3).", eqHTML: PASTED, ans: false },
  { claim: "True or false: the solution of this equation is x = \u221222/7.", eqHTML: PASTED, ans: true },
  { claim: "True or false: x = 4 is the solution of this equation.", eqHTML: f("2x \u2212 1", "3") + " = " + f("x + 2", "2"), ans: false },
  { claim: "True or false: x = \u22127 is the solution of this equation.", eqHTML: f("x + 3", "2") + " = " + f("x \u2212 1", "4"), ans: true },
  { claim: "True or false: x = 8 is the solution of this equation.", eqHTML: f("x \u2212 2", "5") + " = " + f("x + 2", "3"), ans: false },
  { claim: "True or false: x = \u221210 is the solution of this equation.", eqHTML: f("4x + 1", "3") + " = " + f("3x + 4", "2"), ans: true },
  { claim: "True or false: x = 4 is the solution of this equation.", eqHTML: f("x", "3") + " = " + f("x + 4", "5"), ans: false },
  { claim: "True or false: x = 14 is the solution of this equation.", eqHTML: f("x + 1", "3") + " = " + f("2x \u2212 3", "5"), ans: true },
  { claim: "True or false: cross-multiplying this equation gives 2(3x \u2212 2) = 4(x + 2).", eqHTML: f("3x \u2212 2", "4") + " = " + f("x + 2", "2"), ans: true },
  { claim: "True or false: x = \u22125 is the solution of this equation.", eqHTML: f("x \u2212 1", "2") + " = " + f("x + 1", "3"), ans: false }
];
var i = 0, revealed = false, finished = false;
var stage = document.getElementById("stage");
var counter = document.getElementById("counter");
var dotsEl = document.getElementById("dots");
var nextBtn = document.getElementById("next");
var backBtn = document.getElementById("back");

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function render() {
  dotsEl.innerHTML = "";
  for (var d = 0; d < Q.length; d++) {
    var dot = document.createElement("span");
    dot.className = "dot";
    if (finished || d < i || (d === i && revealed)) {
      dot.className += " done " + (Q[d].ans ? "t" : "f");
    } else if (d === i) {
      dot.className += " now";
    }
    dotsEl.appendChild(dot);
  }

  if (finished) {
    counter.textContent = "Done";
    stage.className = "end";
    stage.innerHTML =
      "<h2>That’s all 10.</h2>";
    nextBtn.textContent = "Restart";
    backBtn.disabled = false;
    return;
  }

  var q = Q[i];
  counter.textContent = (i + 1) + " / " + Q.length;
  stage.className = "";
  var html = "<p class=\"claim\">" + esc(q.claim) + "</p>";
  html += "<p class=\"eq\">" + q.eqHTML + "</p>";
  if (revealed) {
    html += "<div class=\"answer " + (q.ans ? "t" : "f") + "\" role=\"status\">" +
      "<p class=\"verdict\">" + (q.ans ? "TRUE" : "FALSE") + "</p></div>";
  }
  stage.innerHTML = html;

  if (!revealed) nextBtn.textContent = "Show answer";
  else if (i === Q.length - 1) nextBtn.textContent = "Finish";
  else nextBtn.textContent = "Next question";
  backBtn.disabled = (i === 0 && !revealed);
}

function next() {
  if (finished) { finished = false; i = 0; revealed = false; }
  else if (!revealed) { revealed = true; }
  else if (i < Q.length - 1) { i++; revealed = false; }
  else { finished = true; }
  render();
}

function back() {
  if (finished) { finished = false; revealed = true; }
  else if (revealed) { revealed = false; }
  else if (i > 0) { i--; revealed = true; }
  render();
}

nextBtn.addEventListener("click", function () { next(); nextBtn.blur(); });
backBtn.addEventListener("click", function () { back(); backBtn.blur(); });
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter" || e.key === "PageDown") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); back(); }
});

render();
</script>
</body>
</html>
