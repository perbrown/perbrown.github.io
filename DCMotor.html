<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DC Motor Magnetic Field Demo</title>

<style>
body {
    margin:0;
    overflow:hidden;
}

#info {
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-family:Arial, sans-serif;
    font-size:16px;
    background:rgba(0,0,0,0.7);
    padding:15px;
    border-radius:8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    pointer-events: auto; /* Ensure we can click the slider */
}

.slider-container {
    margin-top: 12px;
    border-top: 1px solid #555;
    padding-top: 10px;
}

#currentSlider {
    width: 100%;
    margin-top: 5px;
    cursor: pointer;
}
</style>

<script type="importmap">
{
 "imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js"
 }
}
</script>

</head>

<body>

<div id="info">
  <strong>Controls:</strong><br>
  Left mouse button: Rotate view<br>
  Scroll wheel: Zoom
  
  <div class="slider-container">
    <label for="currentSlider"><strong>Wire Current:</strong> <span id="currentVal">1.0</span> A</label><br>
    <input type="range" id="currentSlider" min="0" max="3" step="0.1" value="1">
  </div>
</div>


<script type="module">

import * as THREE from "three";

import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js";


// ----------------
// Scene
// ----------------

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x202020);



const camera = new THREE.PerspectiveCamera(
45,
innerWidth/innerHeight,
0.1,
100
);

camera.position.set(4,3,5);



const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
innerWidth,
innerHeight
);

document.body.appendChild(
renderer.domElement
);



const controls =
new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping=true;



// ----------------
// Materials
// ----------------

const whiteMat =
new THREE.LineBasicMaterial({
color:0xffffff
});


const redMat =
new THREE.LineBasicMaterial({
color:0xff0000
});


const greenMat =
new THREE.LineBasicMaterial({
color:0x00ff00
});


const yellowMat =
new THREE.MeshBasicMaterial({
color:0xffff00
});


const blueMat =
new THREE.LineBasicMaterial({
color:0x0088ff
});

// A solid white material for the white cylinder segment
const solidWhiteMat = new THREE.MeshBasicMaterial({
    color: 0xffffff
});



// ----------------
// Helper
// ----------------

function makeLine(a,b,mat)
{
    let g =
    new THREE.BufferGeometry();

    g.setFromPoints([a,b]);

    return new THREE.Line(
        g,
        mat
    );
}



// ----------------
// Rotor
// ----------------

const rotor =
new THREE.Group();

scene.add(rotor);


const size=2;



// ----------------
// Two-Tone Axle (Split exactly at the right circuit boundary: x = 1.0)
// ----------------

const axleGroup = new THREE.Group();

// Yellow segment: spans from x = -4 to x = 1 (length of 5)
const yellowAxleGeometry = new THREE.CylinderGeometry(
    0.015,
    0.015,
    5,
    16
);

// White segment: spans from x = 1 to x = 4 (length of 3)
const whiteAxleGeometry = new THREE.CylinderGeometry(
    0.015,
    0.015,
    3,
    16
);

// Under Z rotation of PI/2:
// - Y position translates to negative X.
// - To place yellow on the left (x: -4 to 1), we center it at local y = 1.5 (maps to x = -1.5)
const axleYellow = new THREE.Mesh(
    yellowAxleGeometry,
    yellowMat
);
axleYellow.position.y = 1.5;

// To place white on the right (x: 1 to 4), we center it at local y = -2.5 (maps to x = 2.5)
const axleWhite = new THREE.Mesh(
    whiteAxleGeometry,
    solidWhiteMat
);
axleWhite.position.y = -2.5;

axleGroup.add(axleYellow);
axleGroup.add(axleWhite);

// Rotate the combined group so Y maps to the X-axis
axleGroup.rotation.z = Math.PI / 2;

rotor.add(axleGroup);



// ----------------
// Wheel with Spokes (At end of axle)
// ----------------

const wheelGroup = new THREE.Group();

// Place the wheel at the far yellow end (x = -4.0).
wheelGroup.position.set(-4.0, 0, 0);
wheelGroup.rotation.y = Math.PI / 2;

// Create the wheel rim
const wheelRadius = 0.8;
const rimGeometry = new THREE.RingGeometry(wheelRadius - 0.04, wheelRadius, 32);
const rim = new THREE.Mesh(rimGeometry, yellowMat);
wheelGroup.add(rim);

// Create spokes (8 spokes radiating from center)
const numSpokes = 8;
for (let i = 0; i < numSpokes; i++) {
    const angle = (i / numSpokes) * Math.PI * 2;
    const endX = Math.cos(angle) * wheelRadius;
    const endY = Math.sin(angle) * wheelRadius;

    const spoke = makeLine(
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(endX, endY, 0),
        yellowMat
    );
    wheelGroup.add(spoke);
}

// Add the entire wheel assembly to the rotor
rotor.add(wheelGroup);



// ----------------
// White wires (The circuit boundaries are at x = -1.0 and x = 1.0)
// ----------------

rotor.add(
makeLine(
new THREE.Vector3(-size/2,-size/2,0),
new THREE.Vector3(-size/2,size/2,0),
whiteMat
)
);


rotor.add(
makeLine(
new THREE.Vector3(size/2,-size/2,0),
new THREE.Vector3(size/2,size/2,0),
whiteMat
)
);



// ----------------
// Current wires
// ----------------

const redWire =
makeLine(
new THREE.Vector3(-size/2,size/2,0),
new THREE.Vector3(size/2,size/2,0),
redMat
);


const greenWire =
makeLine(
new THREE.Vector3(-size/2,-size/2,0),
new THREE.Vector3(size/2,-size/2,0),
greenMat
);


rotor.add(redWire);
rotor.add(greenWire);



// ----------------
// Magnetic field (fixed)
// ----------------

const magneticField =
makeLine(
new THREE.Vector3(0,0,-1.5),
new THREE.Vector3(0,0,1.5),
blueMat
);

scene.add(magneticField);



const fieldArrow =
new THREE.ArrowHelper(
new THREE.Vector3(0,0,1),
new THREE.Vector3(0,0,1.1),
0.5,
0x0088ff,
0.2,
0.15
);

scene.add(fieldArrow);



// ----------------
// Force vectors
// ----------------

const redForce =
new THREE.ArrowHelper(
new THREE.Vector3(0,-1,0),
new THREE.Vector3(0,size/2,0),
0.9,
0xff0000,
0.2,
0.15
);


const greenForce =
new THREE.ArrowHelper(
new THREE.Vector3(0,1,0),
new THREE.Vector3(0,-size/2,0),
0.9,
0x00ff00,
0.2,
0.15
);


rotor.add(redForce);
rotor.add(greenForce);


// ----------------
// Interactive Current Logic
// ----------------

let currentVal = 1.0;
const slider = document.getElementById("currentSlider");
const displayVal = document.getElementById("currentVal");

// Adjust vector sizes dynamically when slider moves
function updateForceScale() {
    const baseLength = 0.9;
    const targetLength = baseLength * currentVal;
    
    // Prevent ArrowHelper from breaking if current is 0
    const safeLength = Math.max(0.001, targetLength);
    
    // Scale head size alongside arrow length
    const headLength = Math.min(0.2, safeLength * 0.25);
    const headWidth = Math.min(0.15, safeLength * 0.2);

    redForce.setLength(safeLength, headLength, headWidth);
    greenForce.setLength(safeLength, headLength, headWidth);
    
    // Hide forces entirely if current is 0
    redForce.visible = currentVal > 0;
    greenForce.visible = currentVal > 0;
}

slider.addEventListener("input", (e) => {
    currentVal = parseFloat(e.target.value);
    displayVal.textContent = currentVal.toFixed(1);
    updateForceScale();
});


// ----------------
// Commutator switching
// ----------------

let lastSwitch=0;
let reversed=false;


function switchCurrent()
{

reversed=!reversed;


if(reversed)
{
    redWire.material=greenMat;
    greenWire.material=redMat;

    redForce.setColor(0x00ff00);
    greenForce.setColor(0xff0000);
}
else
{
    redWire.material=redMat;
    greenWire.material=greenMat;

    redForce.setColor(0xff0000);
    greenForce.setColor(0x00ff00);
}

}



// ----------------
// Keep forces vertical
// ----------------

function updateForces()
{

let r;
let g;


if(reversed)
{
    r=new THREE.Vector3(0,1,0);
    g=new THREE.Vector3(0,-1,0);
}
else
{
    r=new THREE.Vector3(0,-1,0);
    g=new THREE.Vector3(0,1,0);
}


r.applyQuaternion(
rotor.quaternion.clone().invert()
);


g.applyQuaternion(
rotor.quaternion.clone().invert()
);


redForce.setDirection(r);
greenForce.setDirection(g);

}



// ----------------
// Animation
// ----------------

function animate()
{

requestAnimationFrame(animate);

// Base speed increased to 0.04 and scales dynamically with current selection
const baseSpeed = 0.04; 
rotor.rotation.x += baseSpeed * currentVal;


let turns =
Math.floor(
rotor.rotation.x/Math.PI
);


if(turns!==lastSwitch)
{
    switchCurrent();
    lastSwitch=turns;
}


updateForces();


controls.update();


renderer.render(
scene,
camera
);

}


animate();



// Resize

window.addEventListener(
"resize",
()=>{

camera.aspect =
innerWidth/innerHeight;

camera.updateProjectionMatrix();


renderer.setSize(
innerWidth,
innerHeight
);

});


</script>

</body>
</html>
