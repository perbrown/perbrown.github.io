<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lorentz Force Electron Simulator</title>

<style>

body{
    margin:0;
    background:#222;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    text-align:center;
}

h2{
    margin:10px;
}

#controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin:10px;
    flex-wrap:wrap;
}

#fieldSlider{
    width:300px;
}

button{
    padding:6px 15px;
    font-size:16px;
    cursor:pointer;
}

#label{
    min-width:260px;
    font-size:20px;
}

canvas{
    background:#111;
    border:2px solid white;
}

</style>

</head>


<body>


<h2>Electron in a Magnetic Field</h2>


<div id="controls">

<span>Magnetic Field</span>

<input type="range"
       id="fieldSlider"
       min="-500"
       max="500"
       value="0">


<div id="label">
0 FIELD
</div>


<label>
<input type="checkbox" id="showForce" checked>
Show Force
</label>


<button id="resetBtn">
Reset Electron
</button>


</div>


<canvas id="canvas" width="900" height="650"></canvas>



<script>


const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");


const slider=document.getElementById("fieldSlider");
const label=document.getElementById("label");
const showForce=document.getElementById("showForce");
const resetBtn=document.getElementById("resetBtn");



const electron={

    x:450,
    y:325,

    vx:4,
    vy:0,

    radius:8
};



// electron charge
const charge=-1;


// Controls orbit size
const magneticScale=0.035;



function resetElectron(){

    electron.x=450;
    electron.y=325;

    electron.vx=4;
    electron.vy=0;
}


resetBtn.onclick=resetElectron;




function drawArrow(x,y,dx,dy,color){


    let angle=Math.atan2(dy,dx);


    ctx.strokeStyle=color;
    ctx.fillStyle=color;
    ctx.lineWidth=4;


    ctx.beginPath();

    ctx.moveTo(x,y);
    ctx.lineTo(x+dx,y+dy);

    ctx.stroke();



    let head=12;


    ctx.beginPath();

    ctx.moveTo(
        x+dx,
        y+dy
    );


    ctx.lineTo(
        x+dx-head*Math.cos(angle-Math.PI/6),
        y+dy-head*Math.sin(angle-Math.PI/6)
    );


    ctx.lineTo(
        x+dx-head*Math.cos(angle+Math.PI/6),
        y+dy-head*Math.sin(angle+Math.PI/6)
    );


    ctx.closePath();

    ctx.fill();

}




function drawField(B){


    if(B===0)
        return;


    let symbol=B>0 ? "⊙" : "⊗";


    ctx.fillStyle="#666";
    ctx.font="24px Arial";


    for(let x=30;x<900;x+=55){

        for(let y=35;y<650;y+=55){

            ctx.fillText(symbol,x,y);

        }
    }

}





function animate(){


let B=slider.value/100;



if(B>0)

    label.innerHTML=
    "OUT OF PAGE ⊙ B="+B.toFixed(1);


else if(B<0)

    label.innerHTML=
    "INTO PAGE ⊗ B="+B.toFixed(1);


else

    label.innerHTML=
    "0 FIELD";





ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
);



drawField(B);



let forceX=0;
let forceY=0;



let oldAngle=Math.atan2(
    electron.vy,
    electron.vx
);



if(B!==0){


    let speed=Math.sqrt(
        electron.vx*electron.vx+
        electron.vy*electron.vy
    );



    let newAngle =
        oldAngle
        -
        charge*B*magneticScale;



    electron.vx =
        speed*Math.cos(newAngle);


    electron.vy =
        speed*Math.sin(newAngle);




    // inward force direction

    forceX =
        Math.cos(newAngle)
        -
        Math.cos(oldAngle);


    forceY =
        Math.sin(newAngle)
        -
        Math.sin(oldAngle);

}





electron.x += electron.vx;

electron.y += electron.vy;






// velocity vector

drawArrow(
    electron.x,
    electron.y,
    electron.vx*12,
    electron.vy*12,
    "yellow"
);





// magnetic force vector

if(showForce.checked){

    drawArrow(
        electron.x,
        electron.y,
        forceX*700,
        forceY*700,
        "red"
    );

}




// electron

ctx.beginPath();

ctx.arc(
    electron.x,
    electron.y,
    electron.radius,
    0,
    Math.PI*2
);


ctx.fillStyle="deepskyblue";

ctx.fill();



ctx.fillStyle="white";
ctx.font="18px Arial";


ctx.fillText(
    "e⁻",
    electron.x-8,
    electron.y-15
);





// legend

ctx.fillStyle="yellow";

ctx.fillText(
    "Velocity",
    20,
    30
);



if(showForce.checked){

ctx.fillStyle="red";

ctx.fillText(
    "Magnetic Force (inward)",
    20,
    55
);

}



requestAnimationFrame(animate);


}



animate();


</script>


</body>
</html>
