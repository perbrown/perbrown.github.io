
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --paper:#F6F7F2; --grid:#DCE4EE; --ink:#1E2A44; --muted:#5B6474; --margin:#D2463A;
  --hi:#F2D35B; --card:#FFFFFF; --line:#C9D2DE; --good:#2E7D4F; --bad:#B8322A;
  --key:#FFFFFF; --key-used:#E7EAF0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#171C26; --grid:#232B39; --ink:#E6EAF2; --muted:#9AA3B5; --margin:#E8675C;
    --hi:#8C7420; --card:#1E2431; --line:#343E50; --good:#5CC48A; --bad:#F07B72;
    --key:#232A38; --key-used:#1A1F2A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#171C26; --grid:#232B39; --ink:#E6EAF2; --muted:#9AA3B5; --margin:#E8675C;
  --hi:#8C7420; --card:#1E2431; --line:#343E50; --good:#5CC48A; --bad:#F07B72;
  --key:#232A38; --key-used:#1A1F2A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;
  padding-inline:16px; padding-block:24px 48px;
}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--margin);padding-bottom:10px}
h1{font-family:Kalam,"Comic Sans MS",cursive;font-weight:700;font-size:clamp(2rem,6vw,2.8rem);line-height:1;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted)}
.score{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:.95rem;display:flex;gap:14px}
.score b{font-size:1.2rem}
.score .w b{color:var(--good)} .score .l b{color:var(--bad)}

.levels{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.levels legend{float:left;margin-right:6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.levels label{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:.9rem}
.levels label:has(input:checked){border-color:var(--ink);background:var(--hi)}
.levels input{accent-color:var(--ink);margin:0}
.levels input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.toggle{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.toggle legend{padding:0;margin-bottom:4px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.seg{position:relative;display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{padding:8px 18px;cursor:pointer;font-weight:700;color:var(--ink);background:var(--card)}
.seg input:checked + label{background:var(--ink);color:var(--paper)}
.seg input:focus-visible + label{outline:3px solid var(--hi);outline-offset:-3px}
.picker{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.picker button{
  font:700 1rem "JetBrains Mono",ui-monospace,monospace;padding:8px 0;border-radius:6px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;position:relative
}
.picker button[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.picker button.won{background:var(--good);color:#fff;border-color:var(--good)}
.picker button.lost{background:var(--bad);color:#fff;border-color:var(--bad)}
@media (max-width:520px){.picker{grid-template-columns:repeat(5,1fr)}}

.board{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:20px;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}
@media (max-width:640px){.board{grid-template-columns:1fr;justify-items:center}}
svg.gallows{width:200px;max-width:100%;height:auto}
svg .base{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
svg .part{stroke:var(--margin);stroke-width:5;stroke-linecap:round;fill:none;opacity:0;transition:opacity .25s}
svg .part.on{opacity:1}
@media (prefers-reduced-motion:reduce){svg .part{transition:none}}

.info{display:flex;flex-direction:column;gap:14px;width:100%}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--hi);color:var(--ink)}
.lives{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.clue{margin:0;font-size:1.05rem}
.word{display:flex;flex-wrap:wrap;gap:6px;font-family:"JetBrains Mono",ui-monospace,monospace}
.word span{width:1.6em;border-bottom:3px solid var(--ink);text-align:center;font-size:clamp(1.2rem,4vw,1.7rem);font-weight:700;line-height:1.4}
.word span.miss{color:var(--bad)}
.msg{min-height:1.6em;font-family:Kalam,cursive;font-size:1.35rem;margin:0}
.msg.win{color:var(--good)} .msg.lose{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:700 .95rem "Atkinson Hyperlegible",system-ui,sans-serif;padding:8px 14px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.hint{margin:0;color:var(--muted);font-style:italic}

.keys{display:grid;grid-template-columns:repeat(13,1fr);gap:6px}
@media (max-width:640px){.keys{grid-template-columns:repeat(7,1fr)}}
.keys button{
  font:700 1.05rem "JetBrains Mono",ui-monospace,monospace;padding:10px 0;border-radius:6px;
  border:1.5px solid var(--line);background:var(--key);color:var(--ink);cursor:pointer
}
.keys button:hover:not(:disabled){border-color:var(--ink)}
.keys button:disabled{background:var(--key-used);cursor:default}
.keys button.right{color:var(--good);border-color:var(--good)}
.keys button.wrong{color:var(--bad);border-color:var(--bad);text-decoration:line-through}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
footer{color:var(--muted);font-size:.85rem}
.game{display:flex;flex-direction:column;gap:20px}
.start{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.start h2{font-family:Kalam,"Comic Sans MS",cursive;font-size:1.6rem;margin:0;line-height:1.1}
.start .levels{flex-direction:column;align-items:stretch;width:100%;max-width:360px}
.start .levels legend{float:none;margin-bottom:4px}
.start .levels label{border-radius:8px;font-size:1rem}
.start .levels label input{order:-1}
.startNote{margin:0;color:var(--muted)}
.btn.big{font-size:1.15rem;padding:12px 36px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Hangman</h1>
      <p class="sub" id="levelSub">Pick a topic and level, then press Start.</p>
    </div>
    <div class="score" id="scoreBox" aria-live="polite" hidden>
      <span class="w">Solved <b id="won">0</b></span>
      <span class="l">Missed <b id="lost">0</b></span>
      <span>Left <b id="left">10</b></span>
    </div>
  </header>

  <section class="start" id="startPanel">
    <h2>Choose your game</h2>
    <fieldset class="toggle" id="cats">
      <legend>Topic</legend>
      <div class="seg">
        <input type="radio" name="cat" id="catCurriculum" value="curriculum" checked><label for="catCurriculum">Curriculum</label>
        <input type="radio" name="cat" id="catPop" value="pop"><label for="catPop">Pop Culture</label>
      </div>
    </fieldset>
    <fieldset class="levels" id="levels">
      <legend>Level</legend>
    </fieldset>
    <p class="startNote">Each level has 10 words. You get 6 wrong guesses per word.</p>
    <button class="btn primary big" id="startBtn">Start</button>
  </section>

  <div class="game" id="game" hidden>
  <nav class="picker" id="picker" aria-label="Choose a game"></nav>

  <section class="board">
    <svg class="gallows" viewBox="0 0 200 240" aria-label="Hangman drawing" role="img">
      <path class="base" d="M20 225 H140 M50 225 V20 H130 V45 M50 60 L85 20"/>
      <circle class="part" cx="130" cy="67" r="22"/>
      <path class="part" d="M130 89 V150"/>
      <path class="part" d="M130 105 L105 130"/>
      <path class="part" d="M130 105 L155 130"/>
      <path class="part" d="M130 150 L108 190"/>
      <path class="part" d="M130 150 L152 190"/>
    </svg>
    <div class="info">
      <div class="meta">
        <span class="chip" id="subject">Science</span>
        <span class="lives" id="lives">6 wrong guesses left</span>
      </div>
      <p class="clue" id="clue"></p>
      <div class="word" id="word" aria-live="polite"></div>
      <p class="hint" id="hintText" hidden></p>
      <p class="msg" id="msg" aria-live="assertive"></p>
      <div class="actions">
        <button class="btn" id="hintBtn">Show hint (costs 1 guess)</button>
        <button class="btn" id="answerBtn">Show answer</button>
        <button class="btn primary" id="nextBtn">Next game</button>
        <button class="btn" id="resetBtn">Restart level</button>
        <button class="btn" id="changeBtn">Change level</button>
      </div>
    </div>
  </section>

  <div class="keys" id="keys" aria-label="Letter keys"></div>
  <footer>Tip: you can type letters on your keyboard too.</footer>
  </div>
</div>

<script>

const CATS = {curriculum:LEVELS, pop:POP};
const MAX = 6;
const $ = id => document.getElementById(id);
const parts = [...document.querySelectorAll("svg .part")];
let GAMES, state, cur, level = 0, cat = "curriculum";

function fresh(){ state = GAMES.map(()=>({guessed:new Set(), wrong:0, hint:false, done:null})); cur = 0; }
function buildLevels(){
  for(let i=0;i<5;i++){
    const lab = document.createElement("label");
    lab.innerHTML = '<input type="radio" name="level" id="level'+(i+1)+'" value="'+i+'"'+(i===0?" checked":"")+'> Level '+(i+1);
    $("levels").appendChild(lab);
  }
}

function buildPicker(){
  $("picker").innerHTML = "";
  GAMES.forEach((g,i)=>{
    const b = document.createElement("button");
    b.id = "pick"+i; b.textContent = i+1;
    b.setAttribute("aria-label","Game "+(i+1));
    b.onclick = ()=>{ cur=i; render(); };
    $("picker").appendChild(b);
  });
}
function buildKeys(){
  $("keys").innerHTML = "";
  for(let i=65;i<=90;i++){
    const L = String.fromCharCode(i), b = document.createElement("button");
    b.id = "key"+L; b.textContent = L; b.onclick = ()=>guess(L);
    $("keys").appendChild(b);
  }
}

function guess(L){
  const g = GAMES[cur], st = state[cur];
  if(st.done || st.guessed.has(L)) return;
  st.guessed.add(L);
  if(!g.w.includes(L)) st.wrong++;
  check(); render();
}
function check(){
  const g = GAMES[cur], st = state[cur];
  if([...g.w].every(ch=>st.guessed.has(ch))) st.done = "won";
  else if(st.wrong >= MAX) st.done = "lost";
}

function render(){
  const g = GAMES[cur], st = state[cur];
  $("subject").textContent = g.s;
  $("clue").textContent = "Game "+(cur+1)+": "+g.c;
  const left = MAX - st.wrong;
  $("lives").textContent = left+" wrong guess"+(left===1?"":"es")+" left";
  parts.forEach((p,i)=>p.classList.toggle("on", i < st.wrong));

  $("word").innerHTML = [...g.w].map(ch=>{
    const shown = st.guessed.has(ch);
    if(shown) return "<span>"+ch+"</span>";
    if(st.done==="lost") return '<span class="miss">'+ch+"</span>";
    return "<span>&nbsp;</span>";
  }).join("");
  $("word").setAttribute("aria-label", [...g.w].map(ch=>st.guessed.has(ch)?ch:"blank").join(" "));

  $("hintText").hidden = !st.hint;
  $("hintText").textContent = "Hint: "+g.h;
  $("hintBtn").disabled = st.hint || !!st.done || left <= 1;
  $("answerBtn").disabled = !!st.done;

  const m = $("msg");
  m.className = "msg";
  if(st.done==="won"){ m.textContent = "Solved it! Nice work."; m.classList.add("win"); }
  else if(st.done==="lost"){ m.textContent = st.revealed ? "The answer is "+g.w+". This one counts as missed." : "Out of guesses. The word was "+g.w+"."; m.classList.add("lose"); }
  else m.textContent = "";

  document.querySelectorAll(".keys button").forEach(b=>{
    const L = b.textContent, used = st.guessed.has(L);
    b.disabled = used || !!st.done;
    b.classList.toggle("right", used && g.w.includes(L));
    b.classList.toggle("wrong", used && !g.w.includes(L));
  });

  document.querySelectorAll(".picker button").forEach((b,i)=>{
    b.className = state[i].done || "";
    b.setAttribute("aria-current", i===cur ? "true" : "false");
  });
  const won = state.filter(s=>s.done==="won").length, lost = state.filter(s=>s.done==="lost").length;
  $("won").textContent = won; $("lost").textContent = lost; $("left").textContent = 10-won-lost;
  $("nextBtn").textContent = (won+lost===10) ? "All done!" : "Next game";
  $("nextBtn").disabled = won+lost===10;
}

$("answerBtn").onclick = ()=>{ const st = state[cur]; if(st.done) return; st.revealed = true; st.done = "lost"; render(); };
$("hintBtn").onclick = ()=>{ const st = state[cur]; if(st.done||st.hint) return; st.hint = true; st.wrong++; check(); render(); };
$("nextBtn").onclick = ()=>{
  for(let k=1;k<=10;k++){ const i=(cur+k)%10; if(!state[i].done){ cur=i; break; } }
  render();
};
$("resetBtn").onclick = ()=>{ fresh(); render(); };
document.addEventListener("keydown", e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if($("game").hidden){ if(e.key==="Enter"){ e.preventDefault(); startGame(); } return; }
  const L = e.key.toUpperCase();
  if(/^[A-Z]$/.test(L)) guess(L);
  else if(e.key==="Enter" && state[cur].done) $("nextBtn").click();
});

function startGame(){
  const sel = document.querySelector('input[name="level"]:checked');
  level = sel ? +sel.value : 0;
  const c = document.querySelector('input[name="cat"]:checked');
  cat = c ? c.value : "curriculum";
  GAMES = CATS[cat][level].games;
  fresh();
  $("levelSub").textContent = (cat==="pop"?"Pop Culture":"Curriculum")+" · Level "+(level+1)+" · 10 words";
  $("startPanel").hidden = true;
  $("game").hidden = false; $("scoreBox").hidden = false;
  render();
}
function showStart(){
  $("game").hidden = true; $("scoreBox").hidden = true; $("startPanel").hidden = false;
  $("levelSub").textContent = "Pick a topic and level, then press Start.";
  const r = $("level"+(level+1)); if(r){ r.checked = true; r.focus(); }
}
$("startBtn").onclick = startGame;
$("changeBtn").onclick = showStart;

GAMES = CATS.curriculum[0].games; buildLevels(); buildPicker(); buildKeys(); fresh();
</script>
</body>
</html>
